<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('tbridge-theme')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.setAttribute('data-theme', theme)
        } catch {
          document.documentElement.classList.add('dark')
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
    <title>TBridge — Timezone Conversion</title>
    <meta name="description" content="Convert time across cities using a local city index and DST-aware IANA timezone support." />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="TBridge — Timezone Conversion" />
    <meta property="og:description" content="Convert time across cities using a local city index and DST-aware IANA timezone support." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://tbridge.noel-q.dev/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://tbridge.noel-q.dev/" />
    <link rel="canonical" href="https://tbridge.noel-q.dev/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://tbridge.noel-q.dev/assets/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
